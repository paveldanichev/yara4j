name: Release

# Pushing a tag like v4.5.8-1 builds, tests and publishes a GitHub Release. The first part of
# the version is the YARA version that yara4j follows, the number after the dash counts the
# yara4j releases for that YARA version. Tags with a -beta.N or -rc.N suffix, like
# v4.5.8-1-beta.1, are published as pre-releases of that release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Release tags must look like v4.5.8-1 (YARA version, dash, yara4j release number), optionally followed by -beta.N or -rc.N"
            exit 1
          fi
          yara_version="${BASH_REMATCH[1]}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi
          pom_version=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "${pom_version%-SNAPSHOT}" != "$yara_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the project version $pom_version"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set the version
        run: >
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set
          -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp -Prelease verify

      - name: Collect the files
        run: |
          mkdir dist
          for m in yara4j-core yara4j-magic-tika yara4j-cli; do
            cp "$m/target/$m-$VERSION.jar" "$m/target/$m-$VERSION-sources.jar" dist/
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "yara4j $VERSION" --generate-notes "${flags[@]}"
